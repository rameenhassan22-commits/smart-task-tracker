<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Task Tracker</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='white'/%3E%3Cg transform='translate(4 4)' fill='none' stroke='%231e2a78' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2'/%3E%3Crect x='9' y='3' width='6' height='4' rx='2'/%3E%3Cpath d='m9 14 2 2 4-4'/%3E%3C/g%3E%3C/svg%3E">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <div class="container">
            <a href="#" class="logo">
                <span class="logo-badge">
                    <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2" />
                        <rect x="9" y="3" width="6" height="4" rx="2" />
                        <path d="m9 14 2 2 4-4" />
                    </svg>
                </span>
                Smart Task Tracker
            </a>
            <nav aria-label="Main-Navigation">
                <a href="#tasks">Tasks</a>
                <a href="#statistics">Statistics</a>
            </nav>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="container">
                <h1>Manage Your Tasks</h1>
                <p>
                    Organize your work, track your progress, and stay productive.
                </p>
            </div>
        </section>
        <section class="task-input-section">
            <div class="container">
                <h2><i class="fas fa-pen-to-square"></i> Add a New Task</h2>
                <form class="task-form">
                    <div class="form-group">
                        <label for="task-input">
                            Task Description
                        </label>
                        <input type="text" name="task" id="task-input" placeholder="Enter Your Task.......">
                    </div>
                    <button type="submit">
                        Add Task <i class="fas fa-plus"></i>
                    </button>
                </form>
            </div>
        </section>
        <section id="statistics" class="statistics-section">
            <div class="container">
                <h2>Task Overview</h2>
                <div class="stats-grid">
                    <article class="stats-card">
                        <i class="fas fa-layer-group stats-card-icon"></i>
                        <h3>Total Tasks</h3>
                        <p>0</p>
                    </article>
                    <article class="stats-card">
                         <i class="fas fa-circle-check stats-card-icon"></i>
                        <h3>Completed</h3>
                        <p>0</p>
                    </article>
                    <article class="stats-card">
                        <i class="fas fa-clock stats-card-icon"></i>
                        <h3>Pending</h3>
                        <p>0</p>
                    </article>
                </div>
            </div>
        </section>
        <section id="tasks" class="tasks-section">
            <div class="container">
                <div class="section-heading">
                    <h2>My Tasks</h2>
                    <div class="task-filters">
                        <button type="button">
                            All
                        </button>
                        <button type="button">
                            Active
                        </button>
                        <button type="button">
                            Completed
                        </button>
                    </div>
                </div>
                <div class="task-list">
                    <article class="task-card">
                        <div class="task-content">
                            <input type="checkbox" id="task-1">
                            <label for="task-1">
                                Complete Internship Task
                            </label>
                        </div>
                        <div class="task-actions">
                            <button type="button">
                                <i class="fas fa-pen"></i> Edit
                            </button>
                            <button type="button">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>

                    </article>
                    <article class="task-card completed">
                        <div class="task-content">
                            <input type="checkbox" id="task-2" checked>
                            <label for="task-2">
                                Study Javascript ES6+
                            </label>
                        </div>
                        <div class="task-actions">
                            <button type="button">
                                <i class="fas fa-pen"></i> Edit
                            </button>
                            <button type="button">
                                <i class="fas fa-trash"></i> Delete
                            </button>
                        </div>

                    </article>
                    <article class="task-card">
                        <div class="task-content">
                            <input type="checkbox" id="task-3">
                            <label for="task-3">
                                Practice Rest Api
                            </label>
                        </div>
                        <div class="task-actions">

                            <button type="button">
                                <i class="fas fa-pen"></i> Edit
                            </button>

                            <button type="button">
                                <i class="fas fa-trash"></i> Delete
                            </button>

                        </div>
                    </article>
                </div>
            </div>
        </section>
    </main>
    <footer class="site-footer">
        <div class="container">
            <p>
                &copy; 2026 Smart Task Tracker
            </p>
        </div>
    </footer>
</body>

</html>
